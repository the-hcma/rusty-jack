# Rusty Jack is macOS-only (CoreAudio HAL). Build/test jobs must run on macOS runners.
# The lightweight guard job may run on Linux because it only decides whether to skip Graphite staging PRs.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  RUST_BACKTRACE: 1

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Skip merge-queue staging branches; Graphite validates the integrated state.
          if [[ "${HEAD_REF}" == gtmq_merge_* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  test-macos:
    name: Test (macOS)
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: unit tests
        run: cargo test --all-targets

      - name: build release (host)
        run: cargo build --release --jobs "$(sysctl -n hw.logicalcpu)"

  build-release:
    name: Build release (${{ matrix.target }})
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: build release
        run: cargo build --release --target ${{ matrix.target }} --jobs "$(sysctl -n hw.logicalcpu)"
