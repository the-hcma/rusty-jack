# Rusty Jack is macOS-only (CoreAudio HAL). All jobs must run on macOS runners.
# Linux CI cannot compile or test the real audio stack; non-macOS stub exists only for local editor checks.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  RUST_BACKTRACE: 1

jobs:
  test-macos:
    name: Test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: unit tests
        run: cargo test --all-targets

      - name: build release (host)
        run: cargo build --release --jobs "$(sysctl -n hw.logicalcpu)"

  build-release:
    name: Build release (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: build release
        run: cargo build --release --target ${{ matrix.target }} --jobs "$(sysctl -n hw.logicalcpu)"
