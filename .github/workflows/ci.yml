# Rusty Jack is macOS-only (CoreAudio HAL). Build/test jobs must run on macOS runners.
# The lightweight guard job may run on Linux because it only decides whether to skip Graphite staging PRs.

name: CI

on:
  push:
    branches-ignore:
      - main
      - '**/graphite-base/**'
  pull_request:
    # Stacked PRs (Graphite) target a non-main base branch; run CI anyway.
    types: [opened, reopened, synchronize, ready_for_review, edited]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  RUST_BACKTRACE: 1

jobs:
  guard:
    permissions:
      contents: read
      pull-requests: read
    name: Guard
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          # Skip merge-queue staging branches; Graphite validates the integrated state.
          if [[ "${HEAD_REF}" == gtmq_merge_* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip push CI when an open PR already covers this branch.
          # GitHub always delivers pull_request synchronize for PR-head pushes;
          # the push trigger is only for restacks without an open PR.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            PR_COUNT=$(gh pr list --repo "$GITHUB_REPOSITORY" \
              --head "$BRANCH" --state open \
              --json number --jq 'length' 2>/dev/null || echo 0)
            if [[ "$PR_COUNT" -gt 0 ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Push CI skipped: open PR exists; pull_request handles this push"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
  test-macos:
    name: Test (macOS)
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1
          # refs/pull/N/merge is deleted as soon as a PR merges; head.sha stays fetchable
          # while macOS runners are still queued.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: install Rust toolchain
        run: |
          rustup toolchain install stable \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --target aarch64-apple-darwin \
            --target x86_64-apple-darwin
          rustup default stable

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: unit tests
        run: cargo test --all-targets

      - name: build release (host)
        run: cargo build --release --jobs "$(sysctl -n hw.logicalcpu)"

      - name: validate driver bundle
        run: make validate-driver-bundle

  build-release-aarch64:
    name: Build release (aarch64-apple-darwin)
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: install Rust toolchain
        run: |
          rustup toolchain install stable \
            --profile minimal \
            --target aarch64-apple-darwin
          rustup default stable

      - name: build release
        run: cargo build --release --target aarch64-apple-darwin --jobs "$(sysctl -n hw.logicalcpu)"

  build-release-x86_64:
    name: Build release (x86_64-apple-darwin)
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: install Rust toolchain
        run: |
          rustup toolchain install stable \
            --profile minimal \
            --target x86_64-apple-darwin
          rustup default stable

      - name: build release
        run: cargo build --release --target x86_64-apple-darwin --jobs "$(sysctl -n hw.logicalcpu)"
  secret-scan:
    name: Secret Scan
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Secret Scan
        env:
          GITLEAKS_BASE: ${{ github.event.pull_request.base.sha || '' }}
          GITLEAKS_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/ci/secret-scan
