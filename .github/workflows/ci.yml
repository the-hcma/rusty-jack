# Rusty Jack is macOS-only (CoreAudio HAL). Build/test jobs must run on macOS runners.
# The lightweight guard job may run on Linux because it only decides whether to skip Graphite staging PRs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Stacked PRs (Graphite) target a non-main base branch; run CI anyway.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  RUST_BACKTRACE: 1

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Skip merge-queue staging branches; Graphite validates the integrated state.
          if [[ "${HEAD_REF}" == gtmq_merge_* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  test-macos:
    name: Test (macOS)
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1
          # refs/pull/N/merge is deleted as soon as a PR merges; head.sha stays fetchable
          # while macOS runners are still queued.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: install Rust toolchain
        run: |
          rustup toolchain install stable \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --target aarch64-apple-darwin \
            --target x86_64-apple-darwin
          rustup default stable

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: unit tests
        run: cargo test --all-targets

      - name: build release (host)
        run: cargo build --release --jobs "$(sysctl -n hw.logicalcpu)"

      - name: validate driver bundle
        run: make validate-driver-bundle

  build-release-aarch64:
    name: Build release (aarch64-apple-darwin)
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: install Rust toolchain
        run: |
          rustup toolchain install stable \
            --profile minimal \
            --target aarch64-apple-darwin
          rustup default stable

      - name: build release
        run: cargo build --release --target aarch64-apple-darwin --jobs "$(sysctl -n hw.logicalcpu)"

  build-release-x86_64:
    name: Build release (x86_64-apple-darwin)
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: install Rust toolchain
        run: |
          rustup toolchain install stable \
            --profile minimal \
            --target x86_64-apple-darwin
          rustup default stable

      - name: build release
        run: cargo build --release --target x86_64-apple-darwin --jobs "$(sysctl -n hw.logicalcpu)"
