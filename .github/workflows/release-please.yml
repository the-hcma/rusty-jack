name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v4
        if: steps.release.outputs.release_created == 'true'
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Validate Cargo version
        if: steps.release.outputs.release_created == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "${cargo_version}" != "${VERSION}" ]]; then
            echo "Cargo.toml version ${cargo_version} does not match release ${VERSION}" >&2
            exit 1
          fi

      - name: Compute source archive checksum
        if: steps.release.outputs.release_created == 'true'
        id: archive
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          archive_url="https://github.com/${REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL --retry 6 --retry-delay 5 "${archive_url}" -o source.tar.gz
          sha256="$(sha256sum source.tar.gz | awk '{print $1}')"
          echo "url=${archive_url}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Check tap token
        if: steps.release.outputs.release_created == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "Set HOMEBREW_TAP_TOKEN with write access to the-hcma/homebrew-tap." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.release.outputs.release_created == 'true'
        with:
          repository: the-hcma/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Homebrew formula
        if: steps.release.outputs.release_created == 'true'
        env:
          ARCHIVE_URL: ${{ steps.archive.outputs.url }}
          SHA256: ${{ steps.archive.outputs.sha256 }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/rusty-jack.rb <<FORMULA
          class RustyJack < Formula
            desc "Route HDMI audio for volume keys and wake Sony-like speakers"
            homepage "https://github.com/the-hcma/rusty-jack"
            url "${ARCHIVE_URL}"
            sha256 "${SHA256}"
            license "MIT"
            head "https://github.com/the-hcma/rusty-jack.git", branch: "main"

            depends_on "rust" => :build
            depends_on macos: :monterey

            def install
              ENV["MACOSX_DEPLOYMENT_TARGET"] = "12.0"
              system "cargo", "install", *std_cargo_args, "--locked"
              pkgshare.install "config.example.json", "config.example.sony.json", "launchd"
            end

            def caveats
              <<~EOS
                To create config and install the per-user LaunchAgent:
                  rusty-jack install

                Before uninstalling the formula, stop and remove the LaunchAgent:
                  rusty-jack uninstall --keep-config

                To remove the default config too:
                  rusty-jack uninstall --remove-config
              EOS
            end

            test do
              assert_match "rusty-jack", shell_output("#{bin}/rusty-jack --help")
            end
          end
          FORMULA

      - name: Create tap update PR
        if: steps.release.outputs.release_created == 'true'
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          branch="rusty-jack-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add Formula/rusty-jack.rb
          if git diff --cached --quiet; then
            echo "Formula already current"
          else
            git commit -m "rusty-jack ${TAG}"
            git push --force-with-lease origin "${branch}"
            body="$(cat <<EOF
          ## Summary
          - Update the Rusty Jack formula for ${TAG}.

          ## Test plan
          - Release workflow generated formula
          EOF
          )"
            if gh pr view "${branch}" --repo the-hcma/homebrew-tap >/dev/null 2>&1; then
              gh pr edit "${branch}" --repo the-hcma/homebrew-tap --title "rusty-jack ${TAG}" --body "${body}"
            else
              gh pr create --repo the-hcma/homebrew-tap --base main --head "${branch}" --title "rusty-jack ${TAG}" --body "${body}"
            fi
            gh pr merge "${branch}" --repo the-hcma/homebrew-tap --squash --auto --delete-branch
          fi
