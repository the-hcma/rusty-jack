name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  detect-pending-release:
    name: Detect pending release
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.detect.outputs.pending }}
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Detect unpublished Cargo.toml version
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          tag="v${cargo_version}"

          if gh release view "${tag}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "Release ${tag} already exists"
            exit 0
          fi

          latest_tag="$(gh release list --repo "${REPOSITORY}" --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [[ -z "${latest_tag}" ]]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "No published releases yet; ${tag} is pending"
            exit 0
          fi

          latest_version="${latest_tag#v}"
          if [[ "${cargo_version}" == "${latest_version}" ]]; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "Cargo.toml version ${cargo_version} matches latest release ${latest_tag}"
            exit 0
          fi

          if [[ "$(printf '%s\n' "${latest_version}" "${cargo_version}" | sort -V | tail -n1)" == "${cargo_version}" ]]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "Cargo.toml version ${cargo_version} is ahead of latest release ${latest_tag}"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "Cargo.toml version ${cargo_version} is not ahead of latest release ${latest_tag}"
          fi

  release-pr:
    name: Update release PR
    runs-on: ubuntu-latest
    environment: release-automation
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  publish-release:
    name: Publish release
    needs: detect-pending-release
    if: needs.detect-pending-release.outputs.pending == 'true'
    runs-on: ubuntu-latest
    environment: release
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: publish-release
    if: needs.publish-release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          ref: ${{ needs.publish-release.outputs.tag_name }}

      - name: Validate Cargo version
        env:
          VERSION: ${{ needs.publish-release.outputs.version }}
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "${cargo_version}" != "${VERSION}" ]]; then
            echo "Cargo.toml version ${cargo_version} does not match release ${VERSION}" >&2
            exit 1
          fi

      - name: Compute source archive checksum
        id: archive
        env:
          TAG: ${{ needs.publish-release.outputs.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          archive_url="https://github.com/${REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL --retry 6 --retry-delay 5 "${archive_url}" -o source.tar.gz
          sha256="$(sha256sum source.tar.gz | awk '{print $1}')"
          echo "url=${archive_url}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Check tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "Set HOMEBREW_TAP_TOKEN with write access to the-hcma/homebrew-tap." >&2
            exit 1
          fi

      - uses: actions/checkout@v6.0.3
        with:
          repository: the-hcma/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Homebrew formula
        env:
          ARCHIVE_URL: ${{ steps.archive.outputs.url }}
          ARCHIVE_SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Formula
          make render-homebrew-formula > homebrew-tap/Formula/rusty-jack.rb

      - name: Create tap update PR
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.publish-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          branch="rusty-jack-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add Formula/rusty-jack.rb
          if git diff --cached --quiet; then
            echo "Formula already current"
          else
            git commit -m "rusty-jack ${TAG}"
            git push --force-with-lease origin "${branch}"
            body="$(cat <<EOF
          ## Summary
          - Update the Rusty Jack formula for ${TAG}.

          ## Test plan
          - Release workflow generated formula
          EOF
          )"
            if gh pr view "${branch}" --repo the-hcma/homebrew-tap >/dev/null 2>&1; then
              gh pr edit "${branch}" --repo the-hcma/homebrew-tap --title "rusty-jack ${TAG}" --body "${body}"
            else
              gh pr create --repo the-hcma/homebrew-tap --base main --head "${branch}" --title "rusty-jack ${TAG}" --body "${body}"
            fi
            gh pr merge "${branch}" --repo the-hcma/homebrew-tap --squash --auto --delete-branch
          fi
