name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release and update Homebrew tap
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must look like vMAJOR.MINOR.PATCH: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6.0.3
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Validate Cargo version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "${cargo_version}" != "${VERSION}" ]]; then
            echo "Cargo.toml version ${cargo_version} does not match tag ${VERSION}" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes "Release ${TAG}."
          fi

      - name: Compute source archive checksum
        id: archive
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          archive_url="https://github.com/${REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL --retry 6 --retry-delay 5 "${archive_url}" -o source.tar.gz
          sha256="$(sha256sum source.tar.gz | awk '{print $1}')"
          echo "url=${archive_url}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Check tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "Set HOMEBREW_TAP_TOKEN with write access to the-hcma/homebrew-tap." >&2
            exit 1
          fi

      - uses: actions/checkout@v6.0.3
        with:
          repository: the-hcma/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Homebrew formula
        env:
          ARCHIVE_URL: ${{ steps.archive.outputs.url }}
          ARCHIVE_SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Formula
          make render-homebrew-formula > homebrew-tap/Formula/rusty-jack.rb

      - name: Create tap update PR
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          branch="rusty-jack-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add Formula/rusty-jack.rb
          if git diff --cached --quiet; then
            echo "Formula already current"
          else
            git commit -m "rusty-jack ${TAG}"
            git push --force-with-lease origin "${branch}"
            body="$(cat <<EOF
          ## Summary
          - Update the Rusty Jack formula for ${TAG}.

          ## Test plan
          - Release workflow generated formula
          EOF
          )"
            if gh pr view "${branch}" --repo the-hcma/homebrew-tap >/dev/null 2>&1; then
              gh pr edit "${branch}" --repo the-hcma/homebrew-tap --title "rusty-jack ${TAG}" --body "${body}"
            else
              gh pr create --repo the-hcma/homebrew-tap --base main --head "${branch}" --title "rusty-jack ${TAG}" --body "${body}"
            fi
            gh pr merge "${branch}" --repo the-hcma/homebrew-tap --squash --auto --delete-branch
          fi
